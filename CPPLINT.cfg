set noparent
# 80-char limit is too tight for Arduino code with long framework identifiers
filter=-whitespace/line_length
# PlatformIO uses bare local includes (board_def.h, ntp_localtime.h)
filter=-build/include_subdir
# Embedded C++ uses standard types (long, unsigned long) extensively
filter=-runtime/int
# PlatformIO/Arduino framework handles includes implicitly
filter=-build/include_what_you_use
# Blank line style is minor; not worth blocking CI
filter=-whitespace/blank_line
# Allow intentional empty wait loops used in Arduino startup code
filter=-whitespace/semicolon
