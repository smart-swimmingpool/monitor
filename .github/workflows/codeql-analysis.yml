# We have not automatically identified the languages in your repository.
# Please edit the `language:` list below to add the appropriate supported languages.
# **********************************************************************************
name: "CodeQL"

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"
  schedule:
    - cron: "0 21 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Check
        run: >
          platformio check --environment LILYGO_T5_V231
          --skip-packages

      - name: Run PlatformIO
        run: platformio run --environment LILYGO_T5_V231

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
