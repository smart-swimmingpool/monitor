name: OSV-Scanner

# Vulnerability scan of the resolved PlatformIO dependencies against the OSV database.
# platformio.ini has no lockfile, so the dependencies are resolved with
# `pio pkg install` into .pio/libdeps/<env> and scanned from there. Git-based
# dependencies keep their .git directory and are matched by commit.

on:
  push:
    branches: [main]
    paths:
      - "platformio.ini"
      - "lib/**"
      - ".github/workflows/osv-scanner.yml"
  pull_request:
    branches: [main]
    paths:
      - "platformio.ini"
      - "lib/**"
      - ".github/workflows/osv-scanner.yml"
  schedule:
    # Weekly scan every Monday at 08:00 UTC (same day as the PlatformIO dependency check)
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  extract-deps:
    name: Resolve PlatformIO dependencies (LILYGO_T5_V231)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Install project dependencies
        run: pio pkg install --environment LILYGO_T5_V231

      - name: Upload resolved libraries
        uses: actions/upload-artifact@v7
        with:
          name: pio-libdeps
          path: .pio/libdeps/LILYGO_T5_V231
          retention-days: 2
          if-no-files-found: error

  osv-scan:
    name: OSV-Scanner (LILYGO_T5_V231)
    needs: extract-deps

    permissions:
      actions: read
      contents: read
      # Required to upload SARIF results to the Security > Code Scanning tab
      security-events: write

    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1"
    with:
      download-artifact: pio-libdeps
      scan-args: |-
        --include-git-root
        --allow-no-lockfiles
        --recursive
        ./pio-libdeps
