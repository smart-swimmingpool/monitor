name: SemVer Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  SEMVER_TAG_REGEX: ^v(0|[1-9][0-9]*)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$

jobs:
  validate-semver:
    name: Validate tag format
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Validate SemVer tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ${SEMVER_TAG_REGEX} ]]; then
            echo "::error::Tag '${TAG}' is not valid SemVer (expected vMAJOR.MINOR.PATCH with optional pre-release/build metadata)."
            exit 1
          fi

  build-and-release:
    name: Build firmware and publish GitHub release
    runs-on: ubuntu-latest
    needs: validate-semver
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: platformio run

      - name: Verify release artifacts
        run: |
          test -f .pio/build/LILYGO_T5_V231/firmware.bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .pio/build/LILYGO_T5_V231/firmware.bin
